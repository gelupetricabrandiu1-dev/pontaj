<html lang="ro">
<head>

<link rel="manifest" href="manifest.json">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Pontaj Șantiere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: registru de șantier — antet cu taburi, apoi o foaie de pontaj densă cu coloana de nume fixă la stânga */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --ink:#1c2320; --muted:#5d6964; --line:#d8ddd9; --line-strong:#b6bfba;
  --accent:#1f5c4a; --accent-ink:#ffffff; --accent-soft:#e0ebe6;
  --ochre:#9a6512; --ochre-soft:#f5ead6; --warn:#a13d2d; --warn-soft:#f7e2dd; --empty:#fff2a8; --sat:#f6f7f3; --focus:#2f7d65;
  --scrim:rgba(20,28,25,.38);
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1a201e; --ink:#e5eae7; --muted:#99a5a0; --line:#2b3431; --line-strong:#3e4945;
  --accent:#62b597; --accent-ink:#0c1411; --accent-soft:#1c3129;
  --ochre:#e0a54a; --ochre-soft:#33291a; --warn:#e27d6b; --warn-soft:#3a201b; --empty:#3d3615; --sat:#161c1a; --focus:#82d3b5; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a201e; --ink:#e5eae7; --muted:#99a5a0; --line:#2b3431; --line-strong:#3e4945;
  --accent:#62b597; --accent-ink:#0c1411; --accent-soft:#1c3129;
  --ochre:#e0a54a; --ochre-soft:#33291a; --warn:#e27d6b; --warn-soft:#3a201b; --empty:#3d3615; --sat:#161c1a; --focus:#82d3b5; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 9px;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.status{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
.status.err{color:var(--warn)}
.banner{margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--ochre-soft);color:var(--ink);font-size:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
h2{font-size:24px}
h3{font-size:18px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.toolbar .grow{flex:1}
.weeknav{display:flex;align-items:center;gap:4px}
.weeklabel{font-family:var(--f-display);font-weight:700;font-size:21px;min-width:0;padding-inline:6px}
.weeklabel span{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:7px 10px;font-size:16px;line-height:1}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=date],input[type=month],input[type=text].field{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 10px;font-size:14px;min-width:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip b{font-family:var(--f-display);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.warn{background:var(--ochre-soft);border-color:transparent}
.chip.warn b{color:var(--ochre)}
.sheet{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
thead th{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);padding:8px 4px;background:var(--surface);position:sticky;top:0}
thead th .dn{display:block;font-size:17px;color:var(--ink)}
th.name,td.name{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:170px;max-width:240px;padding:0 10px;border-right:1px solid var(--line)}
thead th.name{z-index:2}
td.name{font-weight:500;overflow:hidden;text-overflow:ellipsis}
td.name .nr{display:inline-block;min-width:1.8em;color:var(--muted);font-size:12px;font-weight:400}
.col-sat{background:var(--sat)}
td.cell input{width:3.4em;height:38px;border:0;background:transparent;text-align:center;font-size:16px;font-variant-numeric:tabular-nums;padding:0}
td.cell input::placeholder{color:var(--line-strong)}
td.cell input:focus{background:var(--accent-soft);outline:2px solid var(--focus);outline-offset:-2px}
td.cell.zero input{color:var(--warn)}
td.cell.zero{background:var(--warn-soft)}
td.cell.empty{background:var(--empty)}
thead th .dk{display:block;margin:4px auto 0;width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
body.locked thead th .dk{pointer-events:none;opacity:.5}
td.cell{position:relative}
.fillh{position:absolute;right:0;bottom:0;width:22px;height:22px;touch-action:none;cursor:crosshair;z-index:2}
.fillh::after{content:'';position:absolute;right:2px;bottom:2px;width:7px;height:7px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 1.5px var(--surface)}
td.fillsel{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)!important}
body.filling,body.filling *{user-select:none;-webkit-user-select:none}
body.locked .fillh{display:none}
td.cell.away{background:var(--accent-soft)}td.cell.away input::placeholder{color:var(--accent);opacity:1;font-weight:700;font-size:13px}
td.cell.abs-l input,td.cell.abs-ro input{font-weight:700;font-size:13px;letter-spacing:-.2px}
td.cell.abs-l{background:var(--surface)}td.cell.abs-l input{color:var(--ink,inherit);background:linear-gradient(#CE1126,#CE1126) no-repeat;background-size:12px 8px;background-position:calc(50% - 8px) 50%;padding-left:13px;box-sizing:border-box}td.cell.abs-l input:focus{background-color:var(--accent-soft)}td.cell.abs-ro{background:var(--surface)}td.cell.abs-ro input{color:var(--ink,inherit);background:linear-gradient(90deg,#002B7F 0 33.33%,#FCD116 33.33% 66.66%,#CE1126 66.66%) no-repeat;background-size:12px 8px;background-position:calc(50% - 11px) 50%;padding-left:15px;box-sizing:border-box}td.cell.abs-ro input:focus{background-color:var(--accent-soft)}
.abspick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}.abspick .btn{flex:1 1 auto}
.abspick .btn.abs-l.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.abspick .btn.abs-l b::before{content:'';display:inline-block;width:15px;height:10px;margin-right:5px;vertical-align:0;background:#CE1126}
.abspick .btn.abs-ro.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.abspick .btn.abs-ro b::before{content:'';display:inline-block;width:15px;height:10px;margin-right:5px;vertical-align:0;background:linear-gradient(90deg,#002B7F 0 33.33%,#FCD116 33.33% 66.66%,#CE1126 66.66%)}
td.tot,th.tot{font-family:var(--f-display);font-weight:700;font-size:17px;padding:0 12px;border-left:1px solid var(--line)}
td.act{padding:0 6px;text-align:right}
td.act .btn{padding:4px 8px;font-size:12px}
tfoot td{font-family:var(--f-display);font-weight:600;font-size:16px;padding:9px 4px;border-bottom:0;border-top:2px solid var(--line-strong);background:var(--surface)}
tfoot td.name{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
tfoot .sub{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted)}
tr:hover td.name{color:var(--accent)}
.below{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.addform{display:flex;gap:6px;flex-wrap:wrap}
.addform input{width:220px}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .below{justify-content:center}
.hint{font-size:13px;color:var(--muted);margin-top:10px;max-width:70ch}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line-strong)}
.rep td{padding:8px 10px}
.rep td.num{font-family:var(--f-display);font-size:16px}
.rep td.num.muted{color:var(--line-strong)}
.rep thead th{padding:8px 10px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h3{margin-bottom:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li input.field{flex:1;min-width:0;border-color:transparent;background:transparent}
.li input.field:hover,.li input.field:focus{border-color:var(--line-strong);background:var(--bg)}
.li.off input.field{color:var(--muted);text-decoration:line-through}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.std{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.std label{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:2px}
.std input{width:3.4em;text-align:center;border:1px solid var(--line-strong);border-radius:6px;padding:6px 0;background:var(--surface)}
.wkgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wk{position:relative}
.wk input{position:absolute;opacity:0;width:1px;height:1px}
.wk span{display:flex;flex-direction:column;align-items:center;min-width:72px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer;user-select:none}
.wk span b{font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.wk span small{font-size:11px;color:var(--muted)}
.wk span:hover{border-color:var(--accent)}
.wk input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk input:checked+span small{color:var(--accent-ink)}
.wk input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
td.name[data-w]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:context-menu}
.grip{display:inline-flex;align-items:center;justify-content:center;width:26px;height:36px;margin:0 2px 0 -8px;padding:0;border:0;background:none;color:var(--line-strong);cursor:grab;touch-action:none;vertical-align:middle;border-radius:4px}
.grip svg{fill:currentColor}
.grip:hover,.grip:focus-visible{color:var(--accent)}
tr.dragging{position:relative;z-index:3;cursor:grabbing}
tr.dragging td,tr.dragging td.name{background:var(--accent-soft)}
tr.dragging .grip{color:var(--accent);cursor:grabbing}
tr.drop-before td{box-shadow:inset 0 3px 0 var(--accent)}
tr.drop-after td{box-shadow:inset 0 -3px 0 var(--accent)}
body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
#lockScreen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lockbox{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;text-align:center}.lockbox h2{margin:0 0 6px}.lockbox .field{text-align:center;font-size:18px}
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--surface);width:100%;max-width:460px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheetbox h3{margin-bottom:4px}
.sheetbox .btn{justify-content:center;padding:12px;font-size:16px}
.sheetbox .hint{margin:0 0 6px}
.btn.danger-fill{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted)}
.kv b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
@media (min-width:641px){.overlay{align-items:center}.sheetbox{border-radius:12px}}
.pay th.grp{font-size:12px;text-transform:uppercase;letter-spacing:.07em;padding:8px 6px 0;border-bottom:0}
.pay th.grp.in{color:var(--accent)}
.pay th.grp.out{color:var(--ochre)}
.pay td{padding:0 4px}
.pay td.num{font-family:var(--f-display);font-size:16px;padding:0 8px;text-align:right}
.pay td.money{font-family:var(--f-display);font-weight:600;font-size:16px;padding:0 10px;text-align:right}
.pay td.sep,.pay th.sep{border-left:2px solid var(--line-strong)}
.pay td.rest{font-weight:700}
.pay td.rest.neg{color:var(--warn)}
.pin{width:4.6em;height:34px;border:1px solid transparent;border-radius:4px;background:transparent;text-align:right;font-size:15px;font-variant-numeric:tabular-nums;padding:0 6px}
.pin:hover{border-color:var(--line-strong)}
.pin:focus{border-color:var(--focus);background:var(--accent-soft);outline:none}
.pin::placeholder{color:var(--muted)}
.pin.txt{width:7.5em;text-align:left}
.pin.note{width:10em;text-align:left}
.pin.ovr{color:var(--ochre);font-weight:600}
.pin.missing{background:var(--ochre-soft)}
.chip.good b{color:var(--accent)}
.saved{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.saved .btn{padding:4px 10px;font-size:13px}
.extras .li input.pin{border-color:var(--line)}
.colpick{display:flex;flex-wrap:wrap;gap:8px}
.colpick .wk span{min-width:0;padding:8px 14px;font-weight:500}
td.cell{position:relative}
td.cell.ok input{color:var(--accent);font-weight:700}
td.cell .dtag{position:absolute;top:1px;right:3px;font-size:10px;line-height:1;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;pointer-events:none}
td.cell.has-diff .advtag{right:auto;left:3px}
td.cell .advtag{position:absolute;top:1px;right:3px;font-size:10px;line-height:1;font-weight:600;color:#d32f2f;font-variant-numeric:tabular-nums;pointer-events:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) td.cell .advtag{color:#ff6b6b}}
:root[data-theme="dark"] td.cell .advtag{color:#ff6b6b}
td.cell.has-note::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent);pointer-events:none}
.legend b.lg-adv{font-size:10px;color:#d32f2f;margin-right:5px}
.dayf{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.dayf .field{font-size:16px;padding:10px 12px;color:var(--ink)}
.sheetbox{max-height:calc(100vh - 24px);overflow:auto}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.idslot{display:flex;flex-direction:column;gap:6px;min-width:0}
.idlbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.idthumb{padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:zoom-in;overflow:hidden;aspect-ratio:1.58;width:100%;max-width:100%}

.idadd{aspect-ratio:1.58;border-style:dashed;justify-content:center;white-space:normal;text-align:center}
.sheetbox.photo img{width:100%;max-height:70vh;object-fit:contain;border-radius:6px;background:var(--bg)}
.hdr-right{display:flex;align-items:center;gap:8px}
.lockbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);cursor:pointer;padding:0}

.lockbtn.on{background:var(--ochre-soft);border-color:var(--ochre);color:var(--ochre)}
body.locked .addform,body.locked .grip,body.locked .idadd,body.locked label[for="backupIn"],body.locked form.std button,body.locked [data-act="fillStd"],body.locked [data-act="rowStd"],body.locked [data-act="copyPrev"],body.locked [data-act="menuConfirm"],body.locked [data-act="dayYes"],body.locked [data-act="dayClear"],body.locked [data-act="dayCode"],body.locked [data-act="toggleArch"],body.locked [data-act="exAdd"],body.locked [data-act="exDel"],body.locked [data-act="payRmManual"],body.locked [data-act="photoDel"]{display:none!important}

table.loans td.lret{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}table.loans tr.lr td{background:var(--accent-soft)}
.loanform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:start}.loanform .below{grid-column:1/-1;margin-top:0}
table.loans{width:100%}table.loans td,table.loans th{padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}

const dirty=new Set(), inflight=new Set(), timers=new Map();
function scheduleSave(id){dirty.add(id);if(!S.db){setStatus('local');return;}setStatus('saving');
  clearTimeout(timers.get(id));timers.set(id,setTimeout(()=>flush(id),500));}
async function flush(id){
  if(inflight.has(id))return;

  const wk=S.weeks.get(id);
  try{ if(wk&&wk.rows.length) await S.db.doc('weeks/'+id).set(clone({...wk,updatedAt:new Date().toISOString()}));
       else await S.db.doc('weeks/'+id).delete(); }
  catch(e){inflight.delete(id);writeErr(e);return;}

}
async function putDoc(path,data){

const weekId=(site,mon)=>'w_'+site+'_'+mon;

function getWeek(site,mon){return S.weeks.get(weekId(site,mon));}
// ultima săptămână completată pe șantier înainte de luni `mon` (nu doar cea imediat dinainte)
function prevWeek(site,mon){let best=null;for(const w of S.weeks.values())if(w.siteId===site&&w.monday<mon&&w.rows&&w.rows.length&&(!best||w.monday>best.monday))best=w;return best;}
function ensureWeek(){const id=weekId(S.siteId,S.monday);let w=S.weeks.get(id);
  if(!w){w={siteId:S.siteId,monday:S.monday,rows:[]};S.weeks.set(id,w);}return [id,w];}
const siteAbbr=id=>{const o=S.sites.get(id);if(!o)return '?';if(o.abbr)return o.abbr;
  return (o.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()||'?';};
function awayAt(wk,w,d){if(!wk)return [];const out=[];
  for(const o of S.weeks.values())if(o.monday===wk.monday&&o.siteId!==wk.siteId){const r=o.rows.find(x=>x.w===w);if(r&&r.h[d]>0)out.push(o.siteId);}
  return out;}
const awayTxt=ids=>ids.map(siteAbbr).join('/');
function calc(wk){
  const rowT=[],dayT=[0,0,0,0,0,0],present=[0,0,0,0,0,0];let total=0,missing=0;
  for(const r of wk?.rows||[]){let t=0;r.h.forEach((v,d)=>{if(v==null){if(!awayAt(wk,r.w,d).length)missing++;return;}t+=v;dayT[d]+=v;if(v>0)present[d]++;});rowT.push(t);total+=t;}
  return {rowT,dayT,present,total,missing};
}
const ABS={L:'Lipsă',RO:'Plecat în România'};
const absCode=(r,d)=>(r&&r.c&&r.c[d])||null;
const cellTxt=(r,d)=>absCode(r,d)||(r.h[d]>0?'✓':fmtH(r.h[d]));
const cellDiff=(r,d)=>{if(absCode(r,d)||!(r.h[d]>0)||S.std[d]==null)return '';const df=Math.round((r.h[d]-S.std[d])*100)/100;return df?(df>0?'+':'')+fmtH(df):'';};
function refreshCell(td,r,d){const i=td.querySelector('input[data-r]');if(i){i.value=cellTxt(r,d);if(!absCode(r,d)&&r.h[d]>0)i.dataset.h=fmtH(r.h[d]);else delete i.dataset.h;}
  const df=cellDiff(r,d);let t=td.querySelector('.dtag');if(df){if(!t){t=document.createElement('span');t.className='dtag';t.setAttribute('aria-hidden','true');td.appendChild(t);}t.textContent=df;}else if(t)t.remove();
  td.classList.toggle('has-diff',!!df);td.classList.toggle('ok',!absCode(r,d)&&r.h[d]>0);td.classList.toggle('empty',r.h[d]==null&&!absCode(r,d)&&!td.classList.contains('away'));}
const isEmpty=(wk,r,d)=>r.h[d]==null&&!absCode(r,d)&&!awayAt(wk,r.w,d).length;
const dayDone=(wk,d)=>!!wk&&wk.rows.length>0&&wk.rows.every(r=>!isEmpty(wk,r,d));
function setCode(r,d,code){if(code){r.c=r.c||[null,null,null,null,null,null];r.c[d]=code;r.h[d]=0;}else if(r.c){r.c[d]=null;if(r.c.every(v=>!v))delete r.c;}}
function parseHours(str,std){
  const s=String(str).trim().replace(',','.');
  if(s==='')return {ok:true,v:null};
  if(std!=null&&/^(✓|✔|v|V|ok|OK)$/.test(s))return {ok:true,v:std};
  if(std!=null&&/^[+-]\d+(\.\d+)?$/.test(s)){const v=Math.round((std+Number(s))*100)/100;return v>=0&&v<=24?{ok:true,v}:{ok:false};}

}

const UNDO=[];

const UNDO_SVG='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

const same=(a,b)=>{const strip=o=>o?JSON.stringify(o,(k,v)=>k==='updatedAt'||k==='_t'?undefined:v):'null';return strip(a)===strip(b);};
function restore(st){
  let n=0;
  for(const id of new Set([...S.weeks.keys(),...Object.keys(st.weeks)])){const a=S.weeks.get(id),b=st.weeks[id];
    if(same(a&&a.rows.length?a:null,b&&b.rows.length?b:null))continue;
    if(b)S.weeks.set(id,clone(b));else if(a)a.rows=[];scheduleSave(id);n++;}
  for(const id of new Set([...S.pay.keys(),...Object.keys(st.pay)])){const a=S.pay.get(id),b=st.pay[id];if(same(a,b))continue;
    if(b){S.pay.set(id,clone(b));savePayLater(id);}else{S.pay.delete(id);if(S.db)S.db.doc('pay/'+id).delete().catch(()=>{});}n++;}
  for(const [coll,m] of [['workers',S.workers],['sites',S.sites],['loans',S.loans]])if(st[coll])
    for(const id of new Set([...m.keys(),...Object.keys(st[coll])])){const a=m.get(id),b=st[coll][id];if(same(a,b))continue;
      if(b){m.set(id,clone(b));putDoc(coll+'/'+id,clone(b));}else{m.delete(id);if(S.db)S.db.doc(coll+'/'+id).delete().catch(()=>{});}n++;}
  if(!same(S.std,st.std)){S.std=st.std.slice();putDoc('config/settings',{std:S.std});n++;}
  return n;
}

  if(S.locked){lockedToast();return;}
  for(let i=UNDO.length-1;i>=0;i--){if(UNDO[i].view!==S.view)continue;const e=UNDO.splice(i,1)[0];
    if(!restore(e.st))continue;   // pas fără efect (ex. ai scris aceeași valoare) → treci la cel dinainte
    S.monday=e.monday;S.siteId=e.siteId;if(e.paySel){S.paySel=new Set(e.paySel);S.paySelSite=e.siteId;}
    S.menu=null;S.undoing=true;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();render();setTimeout(()=>{S.undoing=false;},0);toast(_t('Am anulat ultima modificare.'));return;}

}

/* ---------- reports ---------- */
function monthData(month,site){
  const people=new Map();const weeks=new Map();const siteIds=new Set();
  for(const wk of S.weeks.values()){
    if(site!=='all'&&wk.siteId!==site)continue;
    let touches=false;
    for(let d=0;d<6;d++){
      const date=addDays(wk.monday,d);if(date.slice(0,7)!==month)continue;touches=true;
      for(const r of wk.rows){const v=r.h[d];if(v==null)continue;
        let p=people.get(r.w);if(!p){p={total:0,days:0,by:{}};people.set(r.w,p);}
        const key=site==='all'?wk.siteId:wk.monday;
        p.by[key]=(p.by[key]||0)+v;p.total+=v;if(v>0)p.days++;
      }
    }
    if(touches){if(site==='all')siteIds.add(wk.siteId);else weeks.set(wk.monday,wk);}
  }
  const cols=site==='all'
    ?[...siteIds].sort((a,b)=>sName(a).localeCompare(sName(b),'ro')).map(id=>({key:id,label:sName(id)}))
    :[...weeks.keys()].sort().map(m=>{const sat=addDays(m,5);
        const a=m.slice(0,7)===month?m:month+'-01';
        const end=sat.slice(0,7)===month?sat:fmtD(Date.UTC(+month.slice(0,4),+month.slice(5,7),0));
        return {key:m,label:dm(a)+'–'+dm(end)};});
  const rows=[...people.entries()].map(([w,p])=>({w,...p})).sort((a,b)=>wName(a.w).localeCompare(wName(b.w),'ro'));
  return {cols,rows};
}
function viewReports(){

  let h=`<div class="toolbar"><h2 style="margin-right:8px">${_t('Raport {m} {y}',{m:MONTHS[+mo-1],y})}</h2>

  }
  h+=`<div class="sheet"><table class="rep"><thead><tr><th class="name">${_t('Nume')}</th>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th>${_t('Zile lucrate')}</th><th class="tot">${_t('Total ore')}</th></tr></thead><tbody>`;

  return h;
}

const FS={assets:null,local:false,cache:new Map(),
  idb(){return this._db||(this._db=new Promise((res,rej)=>{const q=indexedDB.open('pontaj-files',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));},
  async idbReq(mode,fn){const db=await this.idb();return new Promise((res,rej)=>{const tx=db.transaction('files',mode);const r=fn(tx.objectStore('files'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);});},
  canWrite(){return this.local||!!this.assets;},
  async put(blob){if(this.local){const k='l:'+rid('f');const out=CR.pw&&!S.decoy?await encBlob(blob):blob;await this.idbReq('readwrite',st=>st.put(out,k));return k;}
    const r=await this.assets.upload(blob,{type:'image/jpeg'});return 'a:'+r.id;},
  async raw(ref){return await this.idbReq('readonly',st=>st.get(ref))||null;},
  async blob(ref){if(this.local){const b=await this.idbReq('readonly',st=>st.get(ref));return b?await decBlob(b).catch(()=>null):null;}
    if(ref.startsWith('a:')){const r=await fetch('/_blob/'+ref.slice(2));return r.ok?await r.blob():null;}return null;},
  async url(ref){if(!ref)return '';if(this.cache.has(ref))return this.cache.get(ref);let u='';
    if(this.local){const b=await this.blob(ref);if(b)u=URL.createObjectURL(b);}else if(ref.startsWith('a:'))u='/_blob/'+ref.slice(2);
    this.cache.set(ref,u);return u;},
  async del(ref){this.cache.delete(ref);if(this.local)await this.idbReq('readwrite',st=>st.delete(ref));
    else if(ref.startsWith('a:')&&this.assets)await this.assets.delete(ref.slice(2));}
};

function gMerge(a,b){
  const out={_del:{...(a._del||{})}};for(const [k,t] of Object.entries(b._del||{}))out._del[k]=Math.max(out._del[k]||0,t);
  for(const c of ['sites','workers','weeks','pay','loans','config']){out[c]={};const A=a[c]||{},B=b[c]||{};
    for(const id of new Set([...Object.keys(A),...Object.keys(B)])){const x=A[id],y=B[id];const w=!x?y:!y?x:((y._t||0)>(x._t||0)?y:x);
      if(w&&(w._t||0)>=(out._del[c+'/'+id]||0))out[c][id]=w;}}
  return out;}
async function gSync(manual){
  if(!S.local||GS.busy||S.decoy)return;if(!GS.valid()){if(manual)toast(_t('Conectează-te din nou la Google.'));return;}

  try{
    const f=await gFind('pontaj-data.json');
    const txt=f?await gFetch(`${DRV}/${f.id}?alt=media`).then(r=>r.text()):'';let remote={};
    if(txt){let plain=txt;if(txt.startsWith('enc1:')){try{plain=await decText(txt);}catch(e){throw new Error('pw');}}remote=JSON.parse(plain);}
    const merged=gMerge(S.db.exportAll(),remote);
    // poze: urcă ce lipsește din Drive, coboară ce lipsește din telefon, șterge din Drive ce nu mai e folosit
    const files={...(remote.files||{})};const used=new Set();

    const fp=await filesFp(),reup=(remote.filesFp||'')!==fp;   // parola s-a schimbat/pus/scos: urcă din nou pozele
    const conv=async b=>{const pl=await decBlob(b).catch(()=>null);if(!pl)return null;return CR.pw?await encBlob(pl):pl;};
    for(const ref of used){const raw=await FS.raw(ref).catch(()=>null);
      if(raw&&!files[ref]){const up=await conv(raw);if(up)files[ref]=await gCreate(ref.replace(/[^\w.-]/g,'_')+'.jpg',up,up.type||'image/jpeg');}
      else if(raw&&files[ref]&&reup){const up=await conv(raw);if(up)await gUpdate(files[ref],up);}
      else if(!raw&&files[ref]){const b=await gFetch(`${DRV}/${files[ref]}?alt=media`).then(r=>r.blob());const pl=await decBlob(b).catch(()=>null);
        const st0=pl?(CR.pw?await encBlob(pl):pl):b;await FS.idbReq('readwrite',st=>st.put(st0,ref));FS.cache.delete(ref);}}
    for(const [ref,id] of Object.entries(files))if(!used.has(ref)){await gFetch(`${DRV}/${id}`,{method:'DELETE'}).catch(()=>{});delete files[ref];}
    merged.files=files;merged.filesFp=fp;merged.syncedAt=new Date().toISOString();
    GS.applying=true;S.db.replaceAll(merged);GS.applying=false;
    const body=CR.pw?await encText(JSON.stringify(merged)):JSON.stringify(merged);

const r2=v=>Math.round(v*100)/100;
const fmtE=v=>v==null?'':r2(v).toLocaleString('ro-RO',{minimumFractionDigits:r2(v)%1?2:0,maximumFractionDigits:2});
const pdirty=new Set(),pinflight=new Set(),ptimers=new Map();
function savePayLater(id){pdirty.add(id);if(!S.db){setStatus('local');return;}setStatus('saving');
  clearTimeout(ptimers.get(id));ptimers.set(id,setTimeout(()=>flushPay(id),600));}
async function flushPay(id){
  if(pinflight.has(id))return;pinflight.add(id);pdirty.delete(id);
  try{await S.db.doc('pay/'+id).set(clone({...S.pay.get(id),updatedAt:new Date().toISOString()}));}
  catch(e){pinflight.delete(id);writeErr(e);return;}
  pinflight.delete(id);if(pdirty.has(id))flushPay(id);else if(!dirty.size&&!inflight.size&&!pdirty.size)setStatus('ok');
}

/* ---------- împrumuturi (avansuri date oamenilor și ce au dat înapoi) ---------- */
function loanSum(t){const p=String(t||'').replace(/\s/g,'').replace(/,/g,'.');if(!/^\d+(\.\d+)?(\+\d+(\.\d+)?)*$/.test(p))return null;const v=r2(p.split('+').reduce((a,b)=>a+Number(b),0));return v>0?v:null;}
function pontajAdvances(){const out=[];
  for(const [wid,wk] of S.weeks)for(const r of wk.rows||[])if(r.a)r.a.forEach((t,d)=>{const v=t&&loanSum(t);if(!v)return;
    const o={w:r.w,d:addDays(wk.monday,d),v,raw:t,ret:false,auto:true,site:wk.siteId,mon:wk.monday,c:0};if(/\+/.test(t))o.t=t;if(r.n&&r.n[d])o.n=r.n[d];out.push(['p|'+wid+'|'+r.w+'|'+d,o]);});
  return out;}
// găsește intrarea: din pontaj (avans pe zi) sau adăugată pe pagina Împrumuturi
function loanRef(id){if(id.startsWith('p|')){const [,wid,w,d]=id.split('|');const wk=S.weeks.get(wid);const r=wk&&wk.rows.find(x=>x.w===w);return r?{auto:true,wid,r,d:+d}:null;}
  const l=S.loans.get(id);return l?{id,l}:null;}
function loanRemove(ref){
  if(ref.auto){const r=ref.r;if(r.a){r.a[ref.d]=null;if(r.a.every(v=>!v))delete r.a;}scheduleSave(ref.wid);}
  else{S.loans.delete(ref.id);if(S.db)S.db.doc('loans/'+ref.id).delete().catch(writeErr);}}
function loanEdit(ref,field,val){
  if(field==='v'){const raw=val.trim().replace(/\s+/g,'');if(!raw||raw==='0'){loanRemove(ref);return 'del';}
    const v=loanSum(raw);if(v==null)return 'bad';
    if(ref.auto){ref.r.a=ref.r.a||[null,null,null,null,null,null];ref.r.a[ref.d]=raw;scheduleSave(ref.wid);}
    else{const l={...ref.l,v};if(/\+/.test(raw))l.t=raw;else delete l.t;S.loans.set(ref.id,l);putDoc('loans/'+ref.id,l);}return 'ok';}
  const n=val.trim();
  if(ref.auto){const r=ref.r;r.n=r.n||[null,null,null,null,null,null];r.n[ref.d]=n||null;if(r.n.every(v=>!v))delete r.n;scheduleSave(ref.wid);}
  else{const l={...ref.l};if(n)l.n=n;else delete l.n;S.loans.set(ref.id,l);putDoc('loans/'+ref.id,l);}return 'ok';}
// cheia unui om la împrumuturi: id-ul din listă, sau „n:nume” pentru cineva care nu e în liste
const loanKey=l=>l.w||findWorkerByName(l.nm||'')||'n:'+normName(l.nm);
const lName=k=>!k.startsWith('n:')?wName(k):(([...S.loans.values()].find(l=>l.nm&&'n:'+normName(l.nm)===k)||{}).nm||k.slice(2));
const loanWho=k=>k.startsWith('n:')?{nm:lName(k)}:{w:k};
function loanGroups(){const g=new Map();
  for(const [id,l] of [...pontajAdvances(),...S.loans]){const k=loanKey(l);let x=g.get(k);if(!x){x={w:k,given:0,back:0,items:[]};g.set(k,x);}if(l.ret)x.back+=l.v;else x.given+=l.v;x.items.push([id,l]);}
  for(const x of g.values()){x.given=r2(x.given);x.back=r2(x.back);x.rest=r2(x.given-x.back);x.items.sort((a,b)=>(b[1].d||'').localeCompare(a[1].d||'')||(b[1].c||0)-(a[1].c||0));}
  return [...g.values()].sort((a,b)=>(b.rest>0)-(a.rest>0)||lName(a.w).localeCompare(lName(b.w),'ro'));}
function viewLoans(){

  h+=`<div class="chips"><div class="chip${rest>0?' warn':''}"><b>${fmtE(rest)} €</b> ${_t('de primit înapoi')}</div>${(k=>`<div class="chip"><b>${k}</b> ${_t(k===1?'om cu datorie':'oameni cu datorie')}</div>`)(gs.filter(x=>x.rest>0).length)}</div>`;
  h+=`<div class="sheet"><table class="loans"><thead><tr><th class="name">${_t('Nume')}</th><th>${_t('Dat')} €</th></tr></thead><tbody>`;

      <td class="rest${x.rest<=0?' zero':''}">${x.rest<=0?'<span class="lok">✓</span>':''}<input class="lin ltot" data-act="noop" data-lw="${x.w}" inputmode="decimal" autocomplete="off" value="${esc(String(Math.max(x.rest,0)).replace('.',','))}" aria-label="${esc(lName(x.w))}: ${_t('Dat')} €"><button class="btn ghost ladd" data-act="loanAddFocus" data-w="${esc(x.w)}" title="${_t('Adaugă încă un împrumut pentru {n}',{n:lName(x.w)})}" aria-label="${_t('Adaugă încă un împrumut pentru {n}',{n:lName(x.w)})}">+</button></td></tr>`;
    if(open)for(const [id,l] of x.items){const cf=S.confirmLoan===id;
      const amt=`<input class="lin" data-lk="${esc(id)}" data-lf="v" inputmode="decimal" autocomplete="off" value="${esc(l.raw||l.t||String(l.v).replace('.',','))}" aria-label="${_t('Sumă')} €">`;
      h+=`<tr class="ld"><td colspan="2"><div class="ldrow"><span class="ldd">${dm(l.d)}.${(l.d||'').slice(0,4)}</span>${l.auto?`<button class="btn ghost lgo" data-act="loanGo" data-site="${esc(l.site)}" data-mon="${l.mon}" title="${_t('Deschide săptămâna în pontaj')}"><span class="lgw">${_t('pontaj')} </span>${esc(sName(l.site))} ↗</button>`:''}
        <input class="lin lnote" data-lk="${esc(id)}" data-lf="n" autocomplete="off" value="${esc(l.n||'')}" placeholder="${_t('notă')}" aria-label="${_t('Notă')}">
        ${l.ret?`<span class="lkind back">${_t('returnat')} −</span>`:'<span class="lkind"></span>'}${amt}<span class="lcur">€</span>
        <button class="btn ${cf?'danger-fill':'ghost danger'}" data-act="loanDel" data-id="${esc(id)}" title="${_t('Șterge')}">${cf?_t('Sigur?'):'✕'}</button></div></td></tr>`;}
    if(open)h+=`<tr class="ld la"><td colspan="2"><form class="ldrow laform" data-act="loanAddForm" data-w="${esc(x.w)}" autocomplete="off"><span class="lkind back" style="margin-left:0">+ ${_t('Împrumut nou')}</span>
      <input class="lin lnote" name="n" placeholder="${_t('notă')}" aria-label="${_t('Notă')}"><input class="lin" name="v" inputmode="decimal" placeholder="${_t('suma')}" aria-label="${_t('Sumă')} €"><span class="lcur">€</span><button class="btn primary">${_t('Adaugă')}</button></form></td></tr>`;
  }
  h+=`</tbody><tfoot><tr><td class="name">${_t('Total')}</td><td>${fmtE(rest)}</td></tr></tfoot></table></div>
  <p class="hint">${_t('Scrie direct în coloana Dat cât mai are de dat omul (ex. din 200 scrii 50). Avansurile din pontaj se schimbă și în pontaj. 0 = șterge tot ce are omul.')} ${_t('Apasă pe nume ca să vezi fiecare sumă.')}</p>`;
  return h;
}
// suma scrisă direct în coloana Dat: dacă omul are o singură sumă, o schimbă pe aceea (și în pontaj);
// dacă are mai multe, trece diferența ca returnare / împrumut în plus; 0 sau gol = șterge tot ce are
function loanSetTotal(w,val){
  const raw=String(val||'').trim().replace(/\s+/g,'');const target=(!raw||/^0+([.,]0+)?$/.test(raw))?0:loanSum(raw);
  if(target==null)return 'bad';
  const x=loanGroups().find(g=>g.w===w);if(!x)return 'none';
  if(target===x.rest)return 'same';
  if(target===0){for(const [id] of x.items){const ref=loanRef(id);if(ref)loanRemove(ref);}return 'del';}
  if(x.items.length===1&&!x.items[0][1].ret){const ref=loanRef(x.items[0][0]);if(ref)loanEdit(ref,'v',raw);return 'ok';}
  const diff=r2(target-x.rest),id=rid('l'),o={...loanWho(w),d:todayStr(),v:Math.abs(diff),ret:diff<0,n:_t('corectare'),c:Date.now()};
  S.loans.set(id,o);putDoc('loans/'+id,o);return 'ok';}

/* ---------- actions ---------- */
function findWorkerByName(name){const n=normName(name);
  for(const [id,w] of S.workers)if(normName(w.name)===n)return id;return null;}
async function createWorker(name){const id=rid('w');const o={name:name.trim().replace(/\s+/g,' '),archived:false};
  S.workers.set(id,o);await putDoc('workers/'+id,o);return id;}
async function addPerson(name){
  if(!name.trim())return;
  let wid=findWorkerByName(name);
  if(!wid)wid=await createWorker(name);
  else if(S.workers.get(wid).archived){const o={...S.workers.get(wid),archived:false};S.workers.set(wid,o);putDoc('workers/'+wid,o);}
  const [id,wk]=ensureWeek();
  if(wk.rows.find(r=>r.w===wid)){toast(_t('{n} e deja în săptămâna asta.',{n:wName(wid)}));return;}
  wk.rows.push({w:wid,h:[null,null,null,null,null,null]});scheduleSave(id);render();
  const f=$('newPerson');if(f)f.focus();
}
async function addSite(name){name=name.trim();if(!name)return;
  const id=rid('s');const o={name,archived:false};S.sites.set(id,o);S.siteId=id;store.set('pz.site',id);
  await putDoc('sites/'+id,o);render();toast(_t('Șantierul {n} a fost adăugat.',{n:name}));}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-view]');if(!t)return;
  if(t.dataset.act==='lock'){S.locked=!S.locked;store.set('pz.lock',S.locked?'1':'0');S.confirmRm=null;S.photoDel=null;render();toast(_t(S.locked?'Editare blocată.':'Editare deblocată.'));return;}
  if(S.locked&&EDIT_ACTS.has(t.dataset.act)){lockedToast();return;}
  if(t.dataset.act==='undo'){undo();return;}
  if(t.dataset.act==='pickPerson'){const f=t.closest('form');const i=f&&f.querySelector('input.field');if(i){i.value=t.dataset.name;t.closest('.sugbox').hidden=true;f.requestSubmit();}return;}
  if(UNDO_ACTS.has(t.dataset.act)||(t.dataset.act==='loanDel'&&S.confirmLoan===t.dataset.id))snap();
  if(t.dataset.view){S.view=t.dataset.view;store.set('pz.view',S.view);S.confirmRm=null;S.exportOpen=false;render();return;}
  const a=t.dataset.act;
  if(a==='wk'){S.monday=addDays(S.monday,+t.dataset.n);S.confirmRm=null;render();}
  else if(a==='today'){S.monday=mondayOf(todayStr());render();}
  else if(a==='copyPrev'){const prev=prevWeek(S.siteId,S.monday);if(!prev)return;const [id,wk]=ensureWeek();
    let n=0;prev.rows.forEach(r=>{if(S.workers.get(r.w)?.archived)return;if(!wk.rows.find(x=>x.w===r.w)){wk.rows.push({w:r.w,h:[null,null,null,null,null,null]});n++;}});
    scheduleSave(id);render();toast(_t('{n} oameni preluați.',{n}));}
  else if(a==='fillStd'){const [id,wk]=ensureWeek();let n=0;wk.rows.forEach(r=>r.h=r.h.map((v,d)=>{if(v==null){n++;return S.std[d];}return v;}));scheduleSave(id);render();toast(_t('{n} celule completate.',{n}));}

// Scrie o celulă cu stil; null/'' devine celulă goală dar formatată (chenar, fundal).
function xc(ws,c,r,v,s,f){
  const cell={s};
  if(f){cell.t='n';cell.v=typeof v==='number'?v:0;cell.f=f;}
  else if(v==null||v===''){cell.t='s';cell.v='';}
  else if(typeof v==='number'){cell.t='n';cell.v=v;}

    if(r&&r.status==='saved')toast(S.local?_t('Fișierul {f} e în Descărcări. În WhatsApp: atașează → Document și alege-l.',{f:filename}):_t('Fișierul {f} a fost salvat.',{f:filename}));}
  catch(e){const c=e&&e.code;if(c==='declined')return;
    if(c==='rate_limited')toast(_t('Ai deja o fereastră de salvare deschisă. Închide-o și încearcă din nou.'));
    else toast(_t('Exportul nu e disponibil aici')+(e&&e.message?': '+e.message:'.'));}
}
const fullRange=(s,e)=>dm(s)+'-'+dm(e)+'.'+e.slice(0,4);
// O foaie ca în Mainz.xlsx: până la 2 săptămâni, una lângă alta (A–I și K–S).
// Pontaj exact ca în Mainz.xlsx: câte 2 săptămâni pe foaie (A–I și K–S, J liberă), Calibri 11 negru,
// gri D9D9D9 pe nr./nume/antet/total, celule albe, chenar subțire; coloana nr. fără chenar stânga, totalul fără chenar dreapta;
// fără rând de total jos și fără foaie de total. Lățimi: A 2,82 · B 15,36 · C–H 2,82 · I 5,45.
const XP=(()=>{const f={name:'Calibri',sz:11,color:{rgb:'000000'}},g=xfill('D9D9D9');
  return {nr:{font:f,fill:g,border:{right:XB,top:XB,bottom:XB}},box:{font:f,fill:g,border:XBOX},
    day:{font:f,fill:g,border:XBOX,numFmt:'@'},tot:{font:f,fill:g,border:{left:XB,top:XB,bottom:XB}},cell:{font:f,border:XBOX}};})();
function xp(ws,c,r,v,s,f){const cell={s};
  if(f){cell.t='n';cell.v=typeof v==='number'?v:0;cell.f=f;}
  else if(v==null||v===''){cell.t='s';cell.v='';}  // la salvare devine celulă complet goală, doar cu chenar (emptyCells)
  else if(typeof v==='number'){cell.t='n';cell.v=v;}
  else{cell.t='s';cell.v=String(v);}
  ws[XLSX.utils.encode_cell({c,r})]=cell;}
function pontajSheet(pair){
  const ws={};let maxR=0;
  pair.forEach((wk,k)=>{
    const o=k*10;const days=[0,1,2,3,4,5].map(d=>addDays(wk.monday,d));const c=calc(wk);
    xp(ws,o,0,null,XP.nr);xp(ws,o+1,0,fullRange(days[0],days[5]),XP.box);
    days.forEach((s,i)=>xp(ws,o+2+i,0,s.slice(8,10),XP.day));xp(ws,o+8,0,null,XP.tot);
    wk.rows.forEach((r,i)=>{const R=1+i,rr=R+1;
      xp(ws,o,R,i+1,XP.nr);xp(ws,o+1,R,wName(r.w),XP.box);
      r.h.forEach((v,d)=>xp(ws,o+2+d,R,absCode(r,d)||(v==null&&awayAt(wk,r.w,d).length?awayTxt(awayAt(wk,r.w,d)):v),XP.cell));
      xp(ws,o+8,R,c.rowT[i],XP.tot,`SUM(${colL(o+2)}${rr}:${colL(o+7)}${rr})`);});
    maxR=Math.max(maxR,wk.rows.length);
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:pair.length>1?18:8}});
  const blk=[{width:2.82},{width:15.36},{width:2.82},{width:2.82},{width:2.82},{width:2.82},{width:2.82},{width:2.82},{width:5.45}];
  ws['!cols']=pair.length>1?[...blk,undefined,...blk]:blk;
  return ws;
}
function exportWeeks(ids){
  if(!ids.length)return;
  const wks=ids.map(id=>S.weeks.get(id)).filter(Boolean).sort((a,b)=>a.monday.localeCompare(b.monday)||sName(a.siteId).localeCompare(sName(b.siteId),'ro'));
  const sites=new Set(wks.map(w=>w.siteId));const multi=sites.size>1;
  const wb=XLSX.utils.book_new();const used=new Set();
  const first0=wks[0].monday,lastSat=addDays(wks[wks.length-1].monday,5);
  // Câte 2 săptămâni pe foaie, pe fiecare șantier; numele foii ca în fișierul tău: 07.09-19.09.2026
  [...sites].forEach(site=>{const sw=wks.filter(w=>w.siteId===site);
    for(let i=0;i<sw.length;i+=2){const pair=sw.slice(i,i+2);
      XLSX.utils.book_append_sheet(wb,pontajSheet(pair),sheetName((multi?sName(site)+' ':'')+fullRange(pair[0].monday,addDays(pair[pair.length-1].monday,5)),used));}});
  const slug=multi?_t('santiere'):sName(wks[0].siteId).replace(/[^\p{L}\p{N}]+/gu,'_');
  save(wb,`${_t('Pontaj')}_${slug}_${first0}_${lastSat}.xlsx`);
}

/* ---------- boot ---------- */
function afterData(){
  if(!(S.loaded.sites&&S.loaded.workers&&S.loaded.weeks))return;
  if(!S.siteId||!S.sites.has(S.siteId)||S.sites.get(S.siteId).archived)S.siteId=activeSites()[0]?.[0]||null;
  if(!dirty.size&&!inflight.size)setStatus('ok');
  render();
}
function subErr(e){if(e&&e.code==='revoked'){S.offline=true;render();return;}toast(_t('Legătura cu baza de date s-a întrerupt. Reîncarcă pagina.'));}
/* Local mode: when the page runs outside claude.ai (installed app / GitHub Pages), data lives in this device's storage. */
function makeLocalDB(mem,init){
  const KEY='pontaj.db.v1';let data={},ro=false;
  if(init)data=init;
  else if(!mem){const raw=localStorage.getItem(KEY)||'';if(raw.startsWith('enc1:'))ro=true;   // criptat, dar fără cheie: nu-l suprascriu
    else try{data=JSON.parse(raw)||{};}catch(e){data={};}}
  const subs=new Set();
  let chain=Promise.resolve(),queued=false;
  const persist=()=>{if(mem||ro)return chain;
    if(CR.pw){if(queued)return chain;queued=true;
      chain=chain.then(async()=>{queued=false;const t=await encText(JSON.stringify(data));localStorage.setItem(KEY,t);})
        .catch(e=>{toast(_t('Salvarea n-a reușit. Verifică conexiunea și încearcă din nou.'));});return chain;}
    try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){throw {code:'quota_exceeded',message:String(e)};}return chain;};
  const notify=()=>subs.forEach(f=>f());
  const sub=f=>{subs.add(f);setTimeout(f,0);return()=>subs.delete(f);};
  return {
    collection(c){return {onSnapshot(next){return sub(()=>next({docs:Object.entries(data[c]||{}).map(([id,v])=>({id,exists:true,data:()=>v}))}));}};},
    doc(path){const [c,id]=path.split('/');return {
      async set(v){(data[c]=data[c]||{})[id]={...clone(v),_t:Date.now()};if(data._del)delete data._del[c+'/'+id];persist();setTimeout(notify,0);if(!mem)GS.onLocalWrite();},
      async delete(){if(data[c])delete data[c][id];(data._del=data._del||{})[c+'/'+id]=Date.now();persist();setTimeout(notify,0);if(!mem)GS.onLocalWrite();},
      onSnapshot(next){return sub(()=>{const v=data[c]&&data[c][id];next({exists:!!v,data:()=>v});});}
    };},
    replaceAll(d){data=clone(d);persist();notify();},
    exportAll(){return clone(data);},
    persistNow(){return persist();}
  };
}
const localDownloads={async save({filename,data}){
  const blob=data instanceof Blob?data:new Blob([data],{type:/\.xlsx$/.test(filename)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/json'});
  try{const f=new File([blob],filename,{type:blob.type});
    const phone=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);   // pe laptop/PC descarcă direct, nu deschide fereastra de partajare
    if(phone&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename,text:filename});return {status:'delivered'};}}
  catch(e){if(e&&e.name==='AbortError')throw {code:'declined'};}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'};
}};
/* ---------- criptare (AES-256-GCM, cheie din parolă cu PBKDF2) ---------- */
// Când există parolă, datele din telefon/laptop, pozele și copia din Google Drive se salvează criptate.
// Text: "enc1:<salt>:<iv>:<date>" (base64). Poze: "PZENC1" + lungime salt + salt + iv + date.
const CR={pw:null,salt:null,keys:new Map()};
const ENC_MAGIC=new TextEncoder().encode('PZENC1');
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s);};
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const canCrypt=()=>!!(window.crypto&&crypto.subtle);
async function crKey(salt,pw=CR.pw){if(!pw)throw new Error('nopw');const id=pw+'\u0000'+salt;if(CR.keys.has(id))return CR.keys.get(id);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(salt),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  CR.keys.set(id,k);return k;}
async function encBytes(u){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await crKey(CR.salt),u));return {iv,ct};}
async function encText(str){const {iv,ct}=await encBytes(new TextEncoder().encode(str));return 'enc1:'+CR.salt+':'+b64e(iv)+':'+b64e(ct);}
async function decText(t,pw=CR.pw){if(!t.startsWith('enc1:'))return t;const [,salt,iv,ct]=t.split(':');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},await crKey(salt,pw),b64d(ct));return new TextDecoder().decode(pt);}
async function isEncBlob(b){if(!b||b.size<7)return false;const h=new Uint8Array(await b.slice(0,6).arrayBuffer());return h.every((x,i)=>x===ENC_MAGIC[i]);}
async function encBlob(b){const {iv,ct}=await encBytes(new Uint8Array(await b.arrayBuffer()));const sb=new TextEncoder().encode(CR.salt);
  return new Blob([ENC_MAGIC,new Uint8Array([sb.length]),sb,iv,ct],{type:'application/octet-stream'});}
async function decBlob(b,pw=CR.pw){if(!(await isEncBlob(b)))return b;if(!pw)return null;const u=new Uint8Array(await b.arrayBuffer());const n=u[6];
  const salt=new TextDecoder().decode(u.subarray(7,7+n)),iv=u.subarray(7+n,19+n),ct=u.subarray(19+n);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},await crKey(salt,pw),ct);return new Blob([pt],{type:'image/jpeg'});}
async function filesFp(){if(!CR.pw)return '';const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pontaj-files|'+CR.pw));return b64e(new Uint8Array(b)).slice(0,16);}
// rescrie datele locale și pozele cu parola curentă (sau necriptate dacă nu mai e parolă); oldPw = parola cu care erau criptate
async function reencryptAll(oldPw){if(!S.local||S.decoy||!S.db||!S.db.persistNow)return;
  await S.db.persistNow();
  let keys=[];try{keys=await FS.idbReq('readonly',st=>st.getAllKeys());}catch(e){keys=[];}
  for(const k of keys){try{const b=await FS.idbReq('readonly',st=>st.get(k));if(!b)continue;
    const plain=(await isEncBlob(b))?await decBlob(b,oldPw||CR.pw):b;if(!plain)continue;
    const out=CR.pw?await encBlob(plain):plain;await FS.idbReq('readwrite',st=>st.put(out,k));FS.cache.delete(k);}catch(e){}}
  GS.onLocalWrite();}
/* ---------- parolă la pornire (pe acest dispozitiv) ---------- */
// Parola greșită deschide aplicația goală (S.decoy): nu citește și nu scrie nimic din datele reale și nu se leagă la Google.
function pwGet(){try{return JSON.parse(store.get('pz.pw')||'null');}catch(e){return null;}}
async function pwHash(pw,salt){const t=salt+'|'+pw;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16);}
function startApp(){const pw=pwGet();if(!pw||!pw.hash){boot();return;}
  const el=document.createElement('div');el.id='lockScreen';
  el.innerHTML=`<form class="lockbox" autocomplete="off"><h2>${_t('Pontaj')}</h2><input type="password" id="lockPw" class="field" autocomplete="current-password" placeholder="${_t('Parola')}" aria-label="${_t('Parola')}"><button class="btn primary">${_t('Intră')}</button></form>`;
  document.body.appendChild(el);setTimeout(()=>{const i=$('lockPw');if(i)i.focus();},60);
  el.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();const v=$('lockPw').value;
    let ok=false;try{ok=(await pwHash(v,pw.salt))===pw.hash;}catch(x){}
    el.remove();if(!ok)S.decoy=true;
    else if(canCrypt()){CR.pw=v;if(!pw.ksalt){pw.ksalt=b64e(crypto.getRandomValues(new Uint8Array(16)));store.set('pz.pw',JSON.stringify(pw));S.needEncrypt=true;}CR.salt=pw.ksalt;}
    boot();});}
async function boot(){
  const cl=S.decoy?null:window.claude;
  let init=null;
  if(!cl&&!S.decoy&&CR.pw){const raw=store.get('pontaj.db.v1')||'';
    if(raw.startsWith('enc1:')){try{init=JSON.parse(await decText(raw));}catch(e){S.decoy=true;setTimeout(()=>toast(_t('Datele de pe acest dispozitiv nu se pot decripta cu această parolă.')),300);}}
    else if(raw)S.needEncrypt=true;}
  if(S.decoy){S.local=true;S.db=makeLocalDB(true);S.dl=localDownloads;FS.local=true;}   // parolă greșită: aplicație goală, fără date și fără Google
  else if(!cl){S.local=true;S.db=makeLocalDB(false,init);S.dl=localDownloads;FS.local=true;gisLoad();
    if(S.needEncrypt){S.needEncrypt=false;setTimeout(()=>reencryptAll(null),800);}
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&GS.valid())gSync();});
    setInterval(()=>{if(GS.valid())gSync();},120000);}
  else cl.use('assets').then(a=>{FS.assets=a;if(S.menu)renderSheet();}).catch(()=>{});
  const [db,dl]=cl?await Promise.all([cl.use('db').catch(()=>null),cl.use('downloads').catch(()=>null)]):[S.db,S.dl];
  S.dl=dl;
  if(!db){S.offline=true;S.loaded={sites:true,workers:true,weeks:true};setStatus('local');afterData();return;}
  S.db=db;
  db.collection('sites').onSnapshot(s=>{S.sites=new Map(s.docs.map(d=>[d.id,clone(d.data())]));S.loaded.sites=true;afterData();},subErr);
  db.collection('workers').onSnapshot(s=>{S.workers=new Map(s.docs.map(d=>[d.id,clone(d.data())]));S.loaded.workers=true;afterData();},subErr);
  db.doc('config/settings').onSnapshot(s=>{const d=s.exists&&s.data();if(d&&Array.isArray(d.std)&&d.std.length===6)S.std=d.std.slice();if(S.loaded.weeks)render();},subErr);
  db.collection('weeks').onSnapshot(s=>{
    const next=new Map();
    for(const d of s.docs){next.set(d.id,(dirty.has(d.id)||inflight.has(d.id))&&S.weeks.has(d.id)?S.weeks.get(d.id):clone(d.data()));}
    for(const id of [...dirty,...inflight])if(!next.has(id)&&S.weeks.has(id))next.set(id,S.weeks.get(id));
    const cur=weekId(S.siteId,S.monday);if(!next.has(cur)&&S.weeks.has(cur)&&!S.weeks.get(cur).rows.length)next.set(cur,S.weeks.get(cur));
    S.weeks=next;S.loaded.weeks=true;afterData();
  },subErr);
  db.collection('loans').onSnapshot(s=>{S.loans=new Map(s.docs.map(d=>[d.id,clone(d.data())]));
    const ae=document.activeElement;if(S.view==='imprumut'&&!(ae&&ae.closest&&ae.closest('.loanform')))render();},subErr);
  db.collection('pay').onSnapshot(s=>{
    const next=new Map();
    for(const d of s.docs){next.set(d.id,(pdirty.has(d.id)||pinflight.has(d.id))&&S.pay.has(d.id)?S.pay.get(d.id):clone(d.data()));}
    for(const id of [...pdirty,...pinflight])if(!next.has(id)&&S.pay.has(id))next.set(id,S.pay.get(id));
    S.pay=next;
  },subErr);
}
render();
startApp();
})();
